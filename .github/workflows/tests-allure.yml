name: Автотесты + Allure + SonarCloud

# Запуск: при каждом изменении в main, на pull request и вручную
# (Actions → Run workflow или кнопка «Запустить в CI» в веб-приложении)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  test:
    name: Тесты, покрытие и анализ кода
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история нужна Sonar для анализа нового кода

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java-автотесты и покрытие (JaCoCo)
        run: mvn -B clean verify -Dmaven.test.failure.ignore=true

      - name: Сценарии веб-тестов совпадают с Java-тестами
        run: |
          python3 tools/extract_cases.py
          git diff --exit-code web/tests/cases.json || {
            echo "::error::web/tests/cases.json устарел. Выполните python3 tools/extract_cases.py и закоммитьте файл."; exit 1; }

      - name: Веб-автотесты (JavaScript)
        id: webtests
        run: node web/tests/run-node.mjs target/allure-results

      - name: Анализ кода в SonarCloud
        if: env.SONAR_TOKEN != ''
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

      - name: SonarCloud без токена
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN не задан — работает автоанализ SonarCloud. Чтобы видеть покрытие, см. docs/ci.md"

      - name: История и сведения о сборке для Allure
        if: always()
        run: |
          mkdir -p target/allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "$PAGES_URL/allure/history/$f" -o "target/allure-results/history/$f" || true
          done
          cat > target/allure-results/executor.json <<EOF
          {"name": "GitHub Actions", "type": "github",
           "buildName": "#${{ github.run_number }} ${{ github.ref_name }}",
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "reportUrl": "$PAGES_URL/allure/"}
          EOF

      - name: Сборка отчёта Allure
        if: always()
        run: mvn -B allure:report

      - name: Сборка веб-приложения
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          rm -rf site && mkdir site
          cp -r web/. site/
          cp -r target/site/allure-maven-plugin site/allure
          [ -d target/site/jacoco ] && cp -r target/site/jacoco site/coverage || true
          python3 tools/build_site_data.py site
          touch site/.nojekyll

      - name: Отчёты как артефакты (можно скачать)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/site/allure-maven-plugin
            target/site/jacoco

      - name: Подготовка для GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Публикация приложения и отчётов
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
