name: Автотесты + Allure + SonarCloud

# Запуск: при каждом изменении в main, на pull request и вручную (Actions → Run workflow)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты, покрытие и анализ кода
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история нужна Sonar для анализа нового кода

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Автотесты и покрытие (JaCoCo)
        run: mvn -B clean verify -Dmaven.test.failure.ignore=true

      - name: Анализ кода в SonarCloud
        if: env.SONAR_TOKEN != ''
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

      - name: SonarCloud не настроен
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::Секрет SONAR_TOKEN не задан, анализ SonarCloud пропущен. Инструкция в docs/ci.md"

      - name: Сборка отчёта Allure
        if: always()
        run: mvn -B allure:report

      - name: Отчёты как артефакты (можно скачать)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/site/allure-maven-plugin
            target/site/jacoco

      - name: Подготовка для GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  deploy:
    name: Публикация отчёта Allure
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
